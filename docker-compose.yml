# AURION single-VPS stack (ADR-020). Secrets come ONLY from the environment
# (an uncommitted .env on the VPS; the E2E driver injects its own throwaways).
# Core services have no profile; `--profile full` adds dashboard + edge.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aurion}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_HOST_PORT:-54320}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-aurion}']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'tools/db/migrate.mjs', 'migrate']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aurion}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurion}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-aurion}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aurion}
      AUTH_MODE: ${AUTH_MODE:-hs256}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?set DATA_ENCRYPTION_KEYS}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ACTION_DISPATCH_MODE: ${ACTION_DISPATCH_MODE:-hermes}
      HERMES_DISPATCH_URL: ${HERMES_DISPATCH_URL:-http://hermes-receiver:8090/dispatch}
      HERMES_DISPATCH_SECRET: ${HERMES_DISPATCH_SECRET:?set HERMES_DISPATCH_SECRET}
      HERMES_DISPATCH_ALLOW_INSECURE_HTTP: ${HERMES_DISPATCH_ALLOW_INSECURE_HTTP:-true}
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 24

  hermes-receiver:
    build:
      context: .
      dockerfile: docker/hermes-receiver.Dockerfile
    environment:
      PORT: '8090'
      HERMES_RECEIVER_SECRET: ${HERMES_DISPATCH_SECRET:?set HERMES_DISPATCH_SECRET}
      # Real connectors as n8n workflows (ADR-030); stub stays the default.
      CONNECTOR_MODE: ${CONNECTOR_MODE:-stub}
      N8N_WEBHOOK_BASE: ${N8N_WEBHOOK_BASE:-}
      N8N_SECRET: ${N8N_SECRET:-}

  voice-gateway:
    build:
      context: .
      dockerfile: docker/voice-gateway.Dockerfile
    environment:
      PORT: '8080'
      AURION_API_URL: http://api:3000
      # Machine identity (ADR-018/ADR-033): static JWT for dev, or
      # client_credentials against the IdP — the gateway validates that
      # exactly one mechanism is configured.
      VOICE_AGENT_TOKEN: ${VOICE_AGENT_TOKEN:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      VOICE_GATEWAY_CLIENT_KEYS: ${VOICE_GATEWAY_CLIENT_KEYS:?set VOICE_GATEWAY_CLIENT_KEYS}
      BRAIN_MODE: ${BRAIN_MODE:-scripted}
      # LLM brain (ADR-022). Required when BRAIN_MODE=llm; fail-closed at boot.
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-300}
      # Post-call AI summary (Phase-30, ADR-039). Defaults to 'on' when LLM is configured.
      POST_CALL_SUMMARY: ${POST_CALL_SUMMARY:-}
      # Server-side STT (ADR-025). The provider key lives HERE, never in a browser.
      STT_MODE: ${STT_MODE:-off}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-gpt-4o-transcribe}
      # Server-side TTS (ADR-026). Same key discipline as STT.
      TTS_MODE: ${TTS_MODE:-off}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_API_URL: ${TTS_API_URL:-}
      TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}
      TTS_VOICE: ${TTS_VOICE:-}
      # Telephony bridge (ADR-027). Requires STT and TTS in openai mode.
      TELEPHONY_MODE: ${TELEPHONY_MODE:-off}
      PHONE_GREETING: ${PHONE_GREETING:-}
      PHONE_LANG: ${PHONE_LANG:-es-ES}
      TELEPHONY_SILENCE_MS: ${TELEPHONY_SILENCE_MS:-600}
      # Streaming-first call STT (ADR-032); empty keeps STT_MODEL.
      TELEPHONY_STT_MODEL: ${TELEPHONY_STT_MODEL:-}
      # Cost guards for paid traffic (ADR-034).
      TELEPHONY_MAX_CONCURRENT: ${TELEPHONY_MAX_CONCURRENT:-4}
      TELEPHONY_MAX_CALLS_PER_DAY: ${TELEPHONY_MAX_CALLS_PER_DAY:-200}
      # Signed TwiML front door (ADR-028).
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TELEPHONY_PUBLIC_URL: ${TELEPHONY_PUBLIC_URL:-}
    ports:
      - '${GATEWAY_HOST_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Public marketing landing (phase 27): static nginx, no profile coupling
  # to the app stack. Routed by the edge to its own subdomain.
  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
    profiles: ['full', 'landing']

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args:
        # Public OIDC endpoints + public client id (ADR-021/ADR-033).
        VITE_OIDC_AUTHORIZATION_URL: ${VITE_OIDC_AUTHORIZATION_URL:-}
        VITE_OIDC_TOKEN_URL: ${VITE_OIDC_TOKEN_URL:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
    profiles: ['full']

  # Self-hosted IdP (ADR-033): closes the ADR-016 jwks production rule
  # without external accounts. Schema lives in the aurion postgres under
  # its own database/role. Enable with --profile idp.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ['idp']
    command: ['start', '--http-relative-path', '/auth']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      # Interpolated even when the profile is off → defaults, and the
      # container itself fails closed on empty values at startup.
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    profiles: ['full']
    environment:
      # Real domain on the VPS (TLS via Let's Encrypt); :80 locally/CI.
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - '${EDGE_HTTP_PORT:-80}:80'
      - '${EDGE_HTTPS_PORT:-443}:443'
    depends_on:
      - api
      - voice-gateway
      - dashboard

volumes:
  postgres-data:
  caddy-data:
