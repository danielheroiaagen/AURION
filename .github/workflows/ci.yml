name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run root lint
        run: npm run lint

      - name: Run project tests
        run: npm test

      - name: Run root typecheck
        run: npm run typecheck

      - name: Run API unit tests
        run: npm run test:api

      - name: Typecheck API
        run: npm --workspace @aurion/api run typecheck

      - name: Build API
        run: npm --workspace @aurion/api run build

      - name: OpenAPI artifact is in sync (ADR-009)
        run: |
          npm run openapi:generate
          git diff --exit-code -- 32_API_REFERENCE/openapi.json

      - name: Typecheck dashboard
        run: npm --workspace @aurion/dashboard run typecheck

      - name: Run dashboard unit tests
        run: npm --workspace @aurion/dashboard run test

      - name: Build dashboard
        run: npm --workspace @aurion/dashboard run build

      - name: Typecheck voice gateway
        run: npm --workspace @aurion/voice-gateway run typecheck

      - name: Run voice gateway unit tests
        run: npm --workspace @aurion/voice-gateway run test

      - name: Build voice gateway
        run: npm --workspace @aurion/voice-gateway run build

      - name: Typecheck widget
        run: npm --workspace @aurion/widget run typecheck

      - name: Run widget unit tests
        run: npm --workspace @aurion/widget run test

      - name: Build widget
        run: npm --workspace @aurion/widget run build

      - name: Typecheck hermes receiver
        run: npm --workspace @aurion/hermes-receiver run typecheck

      - name: Run hermes receiver unit tests
        run: npm --workspace @aurion/hermes-receiver run test

      - name: Build hermes receiver
        run: npm --workspace @aurion/hermes-receiver run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end product loop (compose stack)
        run: npm run e2e

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aurion_test

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (runner end to end)
        run: |
          npm run db:migrate
          npm run db:status

      - name: Run API integration tests
        run: npm run test:api:integration
